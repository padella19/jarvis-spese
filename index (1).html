<style>

.sw.on{background:var(--c1)}.sw.on::after{left:23px}

.h{display:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<main id="v"></main>
<div id="sh"><div id="shc"></div></div>
<div id="toast"></div>
<nav id="nv"></nav>
<script>
const BUDGET=170,MESI=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const IC={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',list:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',chart:'<path d="M5 20V11M12 20V4M19 20v-6"/>',set:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',plus:'<path d="M12 5v14M5 12h14"/>',train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4"/><circle cx="9" cy="14" r=".6"/><circle cx="15" cy="14" r=".6"/>',bed:'<path d="M3 18V6M3 13h18v5M21 13v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="10" r="1.5"/>',fork:'<path d="M6 3v7a2 2 0 0 0 2 2v9M10 3v7M17 3c-2 1.5-2.5 5-2 8h2v10"/>',card:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 11h18"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',left:'<path d="M15 6l-6 6 6 6"/>',right:'<path d="M9 6l6 6-6 6"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',back:'<path d="M21 5H9l-6 7 6 7h12z"/><path d="M12 9l5 6M17 9l-5 6"/>'};
const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const CATS=[{n:"Treno/Trasporti",k:"train",s:"Treno",b:0,c:0,col:"--c3",l:"Tratta",ph:"Milano-Roma"},{n:"Albergo",k:"bed",s:"Albergo",b:1,c:1,col:"--c2",l:"Albergo",ph:"Hotel Aurora"},{n:"Pasto/Ristorante",k:"fork",s:"Pasto",b:1,c:1,col:"--c1",l:"Ristorante",ph:"Da Mario"}];
let S={spese:[],ric:[],pref:{}},tab="home",mode="spesa",ci=2,mm=null,filt="all",F={},tm=null;
const $=id=>document.getElementById(id),p2=n=>String(n).padStart(2,"0");
const fd=d=>p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear();
const pd=s=>{const[g,m,a]=s.split("/").map(Number);return new Date(a,m-1,g)};
const mk=s=>{const x=s.split("/");return x[2]+"-"+x[1]},mkd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1);
const eur=n=>"€ "+n.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cat=n=>CATS.find(c=>c.n===n),isB=n=>!!(cat(n)&&cat(n).b);
const ico=r=>{const c=cat(r.cat)||CATS[0];return`<span class="ci" style="--cc:var(${c.col})">${ic(c.k,20)}</span>`};
const sum=a=>a.reduce((x,r)=>x+r.imp,0),sp=k=>S.spese.filter(r=>mk(r.data)===k);
const ri=k=>sum(S.ric.filter(r=>mk(r.data)===k)),rip=k=>{const[y,m]=k.split("-").map(Number);let t=0;for(let i=1;i<=24;i++){const q=mkd(new Date(y,m-1-i,1)),r=ri(q),s=sum(sp(q));if(r===0&&s===0)break;t+=r-s}return t};
const ymd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()),dy=v=>{const[y,m,g]=v.split("-").map(Number);return new Date(y,m-1,g)};
const sg=r=>{const m=/sog:(\d\d\/\d\d\/\d{4})/.exec(r.desc||"");return m?m[1]:r.data};
const vi=r=>{const m=/via:(\d\d\/\d\d\/\d{4})/.exec(r.desc||"");return m?m[1]:""};
const ora=r=>{const m=/ore:(\d\d:\d\d)/.exec(r.desc||"");return m?m[1]:""};
const isWk=s=>{const g=pd(s).getDay();return g>0&&g<6};
const dlab=v=>{const t=new Date(),a=dy(v),x=Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5);return x===0?"Oggi":x===-1?"Ieri":x===1?"Domani":a.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"})};
const dlabIT=s=>dlab(ymd(pd(s)));
function trip(k){const days={};let wk=0;S.spese.forEach(r=>{if(!isB(r.cat))return;const d=sg(r);if(k&&mk(d)!==k)return;if(isWk(d))(days[d]=days[d]||[]).push(r);else wk+=r.imp});
const ds=Object.keys(days).sort((a,b)=>pd(a)-pd(b)),t=ds.reduce((x,d)=>x+sum(days[d]),0);return{days,ds,n:ds.length,speso:t,budget:BUDGET*ds.length,wk}}
function pj(n){const T=trip(mkd(n)),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),past=T.ds.filter(d=>pd(d)<=t0),s1=past.reduce((x,d)=>x+sum(T.days[d]),0),fut=T.n-past.length,m=past.length?s1/past.length:0;return{T,past:past.length,fut,m,proj:s1+fut*m}}
function ricStima(n){const a=sp(mkd(n)),sal=ri(mkd(n))-sum(a),mt=sum(a)/n.getDate();if(sal<=0)return"cassa in negativo";if(mt<=0)return"—";const x=Math.floor(sal/mt),d=new Date(n);d.setDate(n.getDate()+x);return fd(d).slice(0,5)+" (tra "+x+" gg)"}
const col=p=>p>100?"ko":p>85?"wa":"ok",lab={ok:"In budget",wa:"Attenzione",ko:"Sforato"};
const pl=p=>`<div class="pl ${col(p)}" role="img" aria-label="${Math.round(p)}%"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
const row=(a,b)=>`<div class="r"><span>${a}</span><b>${b}</b></div>`;
const dot=c=>`<i class="dot ${c}"></i>`;
function items(rows){const out=[],seen={};rows.forEach(r=>{if(r.cat==="Albergo"){const k=[r.nome,r.citta,r.data].join("|");if(seen[k]){seen[k].rows.push(r);seen[k].imp+=r.imp;return}seen[k]={rows:[r],imp:r.imp};out.push(seen[k])}else out.push({rows:[r],imp:r.imp})});return out}
function rw(g){const r=g.rows[0],c=cat(r.cat)||CATS[0],n=g.rows.length,s=[];if(r.citta)s.push(esc(r.citta));
if(r.cat==="Albergo"){const f=g.rows.map(sg).sort((a,b)=>pd(a)-pd(b))[0];s.push(n+(n>1?" notti":" notte")+" da "+f.slice(0,5))}
else if(vi(r))s.push("viaggio "+vi(r).slice(0,5)+(ora(r)?" "+ora(r):""));
return`<button class="tr" data-i="${esc(r.id)}" onclick="det(this.dataset.i)">${ico(r)}<span class="tx"><b>${esc(r.nome||c.s)}</b><span class="l">${s.join(" · ")||c.s}</span></span><span class="am">${eur(g.imp)}</span></button>`}
const rwR=(r,i)=>`<button class="tr" onclick="detR(${i})"><span class="ci" style="--cc:var(--ok)">${ic("card",20)}</span><span class="tx"><b>${esc(r.note||"Ricarica")}</b><span class="l">Ricarica</span></span><span class="am pos">+ ${eur(r.imp)}</span></button>`;
const idb=()=>new Promise((s,j)=>{const r=indexedDB.open("jarvis",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>s(r.result);r.onerror=()=>j(r.error)});
async function load(){try{const d=await idb();await new Promise(s=>{const q=d.transaction("k").objectStore("k").get("s");q.onsuccess=()=>{if(q.result)S=q.result;S.pref=S.pref||{};s()};q.onerror=s})}catch(e){}}
async function save(){try{const d=await idb();d.transaction("k","readwrite").objectStore("k").put(S,"s")}catch(e){}}

const cityChips=!R&&c.c?recent("citta",null,null,5):[],nameChips=!R&&!T?recent("nome",c.n,F.city||null,5):(T?recent("nome",c.n,null,5):[]);

else{f.push(`<div class="fg"><div class="fr"><span>Città</span><input type="text" placeholder="Milano" value="${esc(F.city)}" oninput="F.city=this.value" autocapitalize="words" aria-label="Città"></div><div class="fr"><span>${c.l}</span><input type="text" placeholder="${c.ph}" value="${esc(F.nome)}" oninput="F.nome=this.value" autocapitalize="words" aria-label="${c.l}"></div></div>${chips(cityChips,"sC")}${chips(nameChips,"sN")}`);
f.push(`<div class="fg"><div class="fr"><span>${H?"Pagato il":"Data"}</span>${pillD("pd",F.date,"sD")}</div>${H&&!E?`<div class="fr"><span>Prima notte</span>${pillD("ps",F.stay,"sS")}</div><div class="fr"><span>Notti</span><div class="stp"><button aria-label="Meno notti" onclick="nt(-1)">−</button><b id="nn">${F.nights}</b><button aria-label="Più notti" onclick="nt(1)">+</button></div></div>`:""}</div>${H&&!E?`<div class="sgl">Il budget segue le notti del soggiorno; l'importo viene diviso tra le notti.</div>`:""}`)}
const keys=["1","2","3","4","5","6","7","8","9",",","0","<"].map(k=>`<button onclick="kp('${k}')" aria-label="${k==="<"?"Cancella":k}">${k==="<"?ic("back",24):k}</button>`).join("");
sheetOpen(`<div class="sh-h"><button class="xb" aria-label="Chiudi" onclick="shut()">${ic("x",18)}</button>${E?`<b>Modifica spesa</b>`:`<div class="sg2"><button class="${R?"":"on"}" onclick="mode='spesa';sheet()">Spesa</button><button class="${R?"on":""}" onclick="mode='ric';sheet()">Ricarica</button></div>`}<span style="width:36px"></span></div>
${R||E?"":`<div class="cs">${[2,1,0].map(i=>`<button class="${i===ci?"on":""}" style="--cc:var(${CATS[i].col})" onclick="ci=${i};sheet()"><span class="ic">${ic(CATS[i].k,22)}</span>${CATS[i].s}</button>`).join("")}</div>`}
<div id="amt" class="amt${F.amt?"":" z"}" aria-live="polite">${F.amt?"€ "+F.amt:"€ 0"}</div><div id="er" class="l" style="text-align:center;color:var(--ko);min-height:18px"></div>
<div class="fs">${f.join("")}</div><div class="kp">${keys}</div><button id="sv" class="p" onclick="commit()">${amtV()>0?"Salva "+eur(amtV()):"Salva"}</button>`,true);
const mxd=ymd(new Date());document.querySelectorAll('#pd input,#pd').forEach(()=>{});const pdI=document.querySelector('#shc label input[type=date]');if(pdI&&(R||ci!==0)){pdI.max=mxd}}
const sD=v=>{F.date=v;$("pd").textContent=dlab(v)},sS=v=>{F.stay=v;$("ps").textContent=dlab(v)},sV=v=>{F.fv=v;$("pv").textContent=dlab(v)},sV2=v=>{F.fv2=v;$("pv2").textContent=dlab(v)},sO1=v=>{F.fo1=v;$("po1").textContent=v||"Aggiungi"},sO2=v=>{F.fo2=v;$("po2").textContent=v||"Aggiungi"};
const nt=d=>{F.nights=Math.max(1,Math.min(14,F.nights+d));$("nn").textContent=F.nights};
const sC=v=>{F.city=v;sheet()},sN=v=>{F.nome=v;sheet()};
document.addEventListener("focusin",e=>{if(e.target.matches("#shc input[type=text]"))$("shc").classList.add("typing")});
document.addEventListener("focusout",e=>{if(e.target.matches("#shc input[type=text]"))setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches||!a.matches("#shc input[type=text]"))$("shc").classList.remove("typing")},120)});
const rev=s=>{const m=/^(.+?)\s*(?:-|–|>|→)\s*(.+)$/.exec(s);return m?m[2].trim()+"-"+m[1].trim():(s?s+" (ritorno)":"Ritorno")};
function commit(){const im=amtV();if(!(im>0)){const a=$("amt");a.className="amt er";$("er").textContent="Inserisci un importo.";return}
const cl=s=>(s||"").replace(/;/g,",").trim(),nid=(i=0)=>Date.now().toString()+Math.floor(Math.random()*900+100)+i,ids=[],E=F.edit;
const add=o=>{S.spese.push(o);ids.push(o.id)};
if(E)S.spese=S.spese.filter(x=>String(x.id)!==String(E));
if(mode==="ric"){S.ric.push({data:fd(dy(F.date)),imp:im,note:cl(F.nota)||"Ricarica"})}
else{const c=CATS[ci],cit=c.c?cl(F.city):"",nm=cl(F.nome);
if(ci===0){const mkv=(v,o)=>"via:"+fd(dy(v))+(o?" ore:"+o:""),pay=E?(S.spese.length&&F.payKeep)||fd(new Date()):fd(new Date());
if(F.ar&&!E){const v2=F.fv2||F.fv;if(dy(v2)<dy(F.fv)){if(E)S.spese.push(S._old);$("er").textContent="Il ritorno non può essere prima dell'andata.";return}
const a=Math.floor(im/2*100)/100,b=Math.round((im-a)*100)/100;
add({id:nid(1),data:pay,cat:c.n,citta:"",nome:nm,imp:a,desc:mkv(F.fv,F.fo1)});add({id:nid(2),data:pay,cat:c.n,citta:"",nome:rev(nm),imp:b,desc:mkv(v2,F.fo2)})}
else add({id:nid(),data:pay,cat:c.n,citta:"",nome:nm,imp:im,desc:mkv(F.fv,F.fo1)})}
else if(ci===2)add({id:nid(),data:fd(dy(F.date)),cat:c.n,citta:cit,nome:nm,imp:im,desc:""});
else{const pay=fd(dy(F.date)),n=F.nights,d0=dy(F.stay),each=Math.floor(im/n*100)/100;let rest=im;
for(let i=0;i<n;i++){const d=new Date(d0);d.setDate(d0.getDate()+i);const v=i===n-1?Math.round(rest*100)/100:each;rest-=v;add({id:nid(i),data:pay,cat:c.n,citta:cit,nome:nm,imp:v,desc:"sog:"+fd(d)})}}
if(!E){S.pref.ci=ci;if(cit)S.pref.city=cit}}
save();shut();
if(E)toast("Spesa aggiornata");else if(mode==="ric")toast("Ricarica salvata",()=>{S.ric.pop();save()});else toast("Spesa salvata",()=>{const s=new Set(ids.map(String));S.spese=S.spese.filter(x=>!s.has(String(x.id)));save()});
go(tab)}
const ND=(s,nm)=>{const x=(s||"").trim().split(/[\/\-.]/).map(Number);let g,m,a;if(x.length===3&&x.every(n=>n>0)){if(x[0]>999){a=x[0];m=x[1];g=x[2]}else{g=x[0];m=x[1];a=x[2]<100?2000+x[2]:x[2]}}else{const n=(nm||"").toLowerCase(),mi=MESI.findIndex(z=>n.includes(z.toLowerCase())),ym=n.match(/20\d\d/);if(mi<0||!ym)return(s||"").trim();g=1;m=mi+1;a=+ym[0]}return p2(g)+"/"+p2(m)+"/"+a};
function imp(t,nm){const L=t.split(/\r?\n/).filter(x=>x.trim()),h=(L[0]||"").replace(/^\uFEFF/,"");let a=0,b=0;const hl=h.toLowerCase().trim(),n=(nm||"").toLowerCase(),isR=!hl.startsWith("id;")&&(hl.startsWith("data;")||n.includes("ricariche")),isS=!isR&&(hl.startsWith("id;")||n.includes("spese"));
if(isS){const nd=s=>ND(s,nm),h32=s=>{let x=0;for(const ch of s)x=(x*31+ch.charCodeAt(0))|0;return"x"+(x>>>0).toString(36)},key=r=>[r.id,r.data,r.imp.toFixed(2),r.cat].join("|"),have=new Set(S.spese.map(key));L.slice(1).forEach(l=>{const c=l.split(";");if(!c[1])return;const o={data:nd(c[1]),cat:(c[2]||"").trim(),citta:c[3]||"",nome:c[4]||"",imp:parseFloat((c[5]||"").replace(",","."))||0,desc:c[6]||""};o.id=(c[0]||"").trim()||h32([o.data,o.cat,o.imp.toFixed(2),o.nome].join("|"));if(have.has(key(o)))return;have.add(key(o));S.spese.push(o);a++})}
else if(isR){const key=r=>[r.data,r.imp.toFixed(2),r.note].join("|"),ex={},seen={};S.ric.forEach(r=>{ex[key(r)]=(ex[key(r)]||0)+1});L.slice(1).forEach(l=>{const c=l.split(";"),o={data:ND(c[0],nm),imp:parseFloat((c[1]||"").replace(",","."))||0,note:c[2]||""};if(!o.data)return;const q=key(o);seen[q]=(seen[q]||0)+1;if(seen[q]<=(ex[q]||0))return;S.ric.push(o);b++})}
else return null;
return[a,b]}
async function onImp(e){let A=0,B=0,o=[];for(const f of e.target.files){const tx=await f.text(),r=imp(tx,f.name);if(!r){o.push("Attenzione, "+esc(f.name)+": "+(tx.trim()?"non riconosciuto, inizia con «"+esc(tx.slice(0,40))+"»":"file vuoto, forse non ancora scaricato da iCloud"));continue}A+=r[0];B+=r[1];o.push(esc(f.name)+": "+r[0]+" spese, "+r[1]+" ricariche nuove")}save();$("im").innerHTML=o.join("<br>")+"<br><b>Totale: "+A+" spese e "+B+" ricariche importate.</b>"}
async function exp(t){const txt=t==="s"?"ID;Data;Categoria;Città;Nome;Importo;Descrizione\n"+S.spese.map(r=>[r.id,r.data,r.cat,r.citta,r.nome,r.imp.toFixed(2),r.desc].join(";")).join("\n")+"\n":"Data;Importo;Note\n"+S.ric.map(r=>[r.data,r.imp.toFixed(2),r.note].join(";")).join("\n")+"\n";
